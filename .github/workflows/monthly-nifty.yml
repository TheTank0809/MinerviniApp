name: Monthly Nifty scan

on:
  schedule:
    # 28th of every month, 09:30 UTC = 15:00 IST — same time-of-day as the weekly scan.
    # GitHub Actions cron has no native "last day of month" trigger; the 28th exists in
    # every month and lands close enough to end-of-month without extra scripting.
    - cron: "30 9 28 * *"
  workflow_dispatch: {}    # run it manually from the Actions tab any time

permissions:
  contents: write

concurrency:
  group: monthly-nifty-scan
  cancel-in-progress: false

jobs:
  should-run:
    # Cost guard: if this has already run within the last 20 days (e.g. a manual
    # trigger earlier in the month), skip the scheduled run rather than re-running the
    # LLM verdict/catalyst calls for data that's still fresh. A manual "Run workflow"
    # click always runs regardless — this only skips the automatic schedule.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manually triggered — running regardless of when the last scan was."
            exit 0
          fi
          last=$(git log --format=%cI --grep="^Monthly Nifty scan" -1)
          if [ -z "$last" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No prior monthly Nifty scan commit found — running."
            exit 0
          fi
          last_epoch=$(date -d "$last" +%s)
          now_epoch=$(date -u +%s)
          diff_days=$(( (now_epoch - last_epoch) / 86400 ))
          echo "Last monthly Nifty scan: $last ($diff_days day(s) ago)"
          if [ "$diff_days" -ge 20 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — already scanned within the last 20 days."
          fi

  scan:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Nifty pipeline
        id: pipeline
        continue-on-error: true   # a failed run still needs to reach the site — see below
        env:
          SCREENER_SESSIONID: ${{ secrets.SCREENER_SESSIONID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python backend/pipeline_nifty.py

      # deploy-site.yml already redeploys Pages on any push touching docs/** — no
      # separate deploy job needed here, unlike weekly.yml (which predates that).
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "minervini-bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Monthly Nifty scan $(date -u +%F)"
          git push

      - name: Fail job if the pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1   # data is already committed above; this just marks the Actions run red
