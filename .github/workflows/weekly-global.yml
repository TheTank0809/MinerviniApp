name: Weekly Global scan

on:
  schedule:
    # Sunday, 11:30 UTC — an hour after the weekly India-S scan (09:30) and its
    # own separate slot from the Nifty scan's 28th-of-month run, so none of the
    # three compete for runner/rate limits.
    - cron: "30 11 * * 0"
  workflow_dispatch: {}    # run it manually from the Actions tab any time

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-global-scan
  cancel-in-progress: false

jobs:
  should-run:
    # Cost guard: same 48-hour window as the weekly India-S scan — skip the
    # scheduled run if this already ran recently (e.g. a manual trigger earlier
    # in the week). A manual "Run workflow" click always runs regardless.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manually triggered — running regardless of when the last scan was."
            exit 0
          fi
          last=$(git log --format=%cI --grep="^Weekly Global scan" -1)
          if [ -z "$last" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No prior weekly Global scan commit found — running."
            exit 0
          fi
          last_epoch=$(date -d "$last" +%s)
          now_epoch=$(date -u +%s)
          diff_hours=$(( (now_epoch - last_epoch) / 3600 ))
          echo "Last weekly Global scan: $last ($diff_hours hour(s) ago)"
          if [ "$diff_hours" -ge 48 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — already scanned within the last 48 hours."
          fi

  scan:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Global pipeline
        id: pipeline
        continue-on-error: true   # a failed run still needs to reach the site — see below
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python backend/pipeline_global.py

      # A push made with this job's own default GITHUB_TOKEN does NOT trigger
      # deploy-site.yml's `on: push` (GitHub's anti-recursion behavior — see
      # monthly-nifty.yml's history), so this job deploys itself directly.
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "minervini-bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Weekly Global scan $(date -u +%F)"
          git push

      - name: Upload site
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Fail job if the pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1   # data/site are already committed/uploaded above; this just marks the Actions run red

  deploy:
    needs: scan
    if: ${{ needs.scan.result == 'success' || needs.scan.result == 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
