# MinerviniApp configuration
# Add new screens or universes here; the pipeline and website pick them up automatically.

settings:
  benchmark_index: "^CRSLDX"        # Nifty 500 on Yahoo Finance
  benchmark_fallback: "^NSEI"       # Nifty 50 (used if Nifty 500 data is unavailable)
  min_median_daily_traded_value_cr: 5
  max_promoter_pledge_pct: 15
  buy_zone_extension_pct: 5
  max_stop_pct: 10
  history_years: 2                  # OHLCV lookback
  request_delay_seconds: 1.2        # politeness delay between screener.in requests
  rs_universe_min_symbols: 100      # below this many successful fetches, fall back to tracked-only RS ranking
  rs_universe_lookback_years: 1     # OHLCV lookback for the broad RS reference universe (only needs ~1yr for the RS formula)
  global_benchmark_index: "^GSPC"   # S&P 500 — regime benchmark for the Global universe (a proxy, not a true "whole world" index)
  llm_model: "claude-sonnet-5"      # used only if ANTHROPIC_API_KEY is set
  llm_max_new_stocks_per_run: 25    # cost guard for verdict synthesis
  llm_max_existing_catalyst_checks_per_run: 10  # cost guard for the lighter recheck below
  llm_catalyst_recheck_days: 30     # how often an already-tracked stock's H3/governance is rechecked

universes:
  india:
    label: "India-S"
    enabled: true
    currency: "INR"
    yahoo_suffixes: [".NS", ".BO"]
    # RS percentile is ranked against this list instead of just the tracked stocks below
    # (which, being pre-filtered by the screens, otherwise inflates everyone's RS). Static
    # file, not fetched live — refresh occasionally from NSE's own archive (constituents
    # don't change often enough for staleness to matter much between refreshes):
    #   curl -A "Mozilla/5.0" https://archives.nseindia.com/content/indices/ind_nifty500list.csv \
    #     -o backend/data/universe_india.csv
    rs_universe_csv: "backend/data/universe_india.csv"
    rs_universe_label: "Nifty 500"
    screens:
      # url = paste the exact address bar URL of the screen on screener.in, no edits.
      # slug = internal folder name under docs/data/ — can be anything, unrelated to screener.in.
      # short = the tick-badge code shown per stock on the website when it's in this screen.
      - name: "Minervini Screener"
        url: "https://www.screener.in/screens/877182/minervini-screener/"
        slug: "minervini-filter"
        short: "MV"
        enabled: true
      - name: "Growth Screener"
        url: "https://www.screener.in/screens/873628/growth-screener/"
        slug: "growth-filter"
        short: "GR"
        enabled: true

  india-nifty:
    label: "India-Nifty"
    enabled: true
    currency: "INR"
    yahoo_suffixes: [".NS", ".BO"]
    # Ranked against the same broad Nifty 500 reference as India-S, for comparable RS
    # methodology across universes.
    rs_universe_csv: "backend/data/universe_india.csv"
    rs_universe_label: "Nifty 500"
    # Unlike `screens` (a screener.in saved-screen URL), an `indices` entry tracks every
    # constituent of a static NSE index list — see pipeline_nifty.py.
    indices:
      - name: "Nifty 100"
        slug: "nifty100"
        short: "N100"
        enabled: true
        constituents_csv: "backend/data/universe_nifty100.csv"
        # "anthropic" or "deepseek" — flip this line any time to switch which model
        # handles both the new-stock verdict and the existing-stock recheck for this
        # index. Needs the matching secret set: ANTHROPIC_API_KEY or DEEPSEEK_API_KEY.
        llm_provider: "deepseek"
        # Verify this against DeepSeek's current docs when you add the key — model
        # names shift. "claude-sonnet-5" if you switch llm_provider to "anthropic".
        llm_model: "deepseek-chat"
        # Sized for the bootstrap load: all ~100 constituents want a verdict in the
        # first run, not spread over months the way the weekly screens' budget of 25
        # is (see backend/llm.py and pipeline_nifty.py's module docstring).
        llm_max_new_stocks_per_run: 100
        llm_max_existing_catalyst_checks_per_run: 20

  global:
    label: "Global"
    enabled: true
    currency: "USD"
    # No screener.in equivalent for international stocks — the universe AND
    # fundamentals both come from a TradingView growth-screen query instead (see
    # backend/tradingview_client.py, backend/fundamentals_tradingview.py). This is
    # a real threshold screen re-evaluated every run (not a fixed constituent
    # list like India-Nifty), so it keeps normal new/dropped/"Left the screen"
    # tracking, same as India-S.
    global_screens:
      - name: "Growth Screener"
        slug: "growth-screener"
        short: "GR"
        enabled: true
        # Mirrors the 3 active thresholds on the TradingView screen this was built
        # from (https://in.tradingview.com/screener/LskWhbOz/, "Growth Screener",
        # Entire world) — everything else on that screen is a display column, not
        # an actual filter. "will improve later" per the original request; these
        # are all easy to retune here without touching code.
        min_eps_growth_pct: 25       # EPS dil growth, Annual YoY
        min_revenue_cagr_5y_pct: 15  # Revenue growth, 5 year CAGR (computed client-side, strict
                                     # endpoint-to-endpoint — not a native TradingView query field,
                                     # see pipeline_global.py). Lowered from 25 -> 15 since the
                                     # strict calc cuts much harder than TradingView's own version.
        max_debt_to_equity: 0.1      # Debt/equity, FY
        min_market_cap: 1000000000   # $1B floor — matches the actual TradingView screen (which
                                     # has no market-cap filter at all; this is still a deliberate
                                     # narrowing for cost, not a match to "no floor").
        exclude_countries: ["Pakistan", "India"]  # India is already covered by India-S/India-Nifty
        scan_limit: 1000
        llm_provider: "deepseek"    # "deepseek" or "anthropic" — same switch as India-Nifty
        llm_model: "deepseek-chat"
        llm_max_new_stocks_per_run: 100
        llm_max_existing_catalyst_checks_per_run: 20
